<text x="1725" y="258" text-anchor="middle" font-size="38" font-weight="700" fill="#253C50">적 생성과 이동</text>
<text x="1725" y="306" text-anchor="middle" font-size="30" font-weight="400" fill="#344F63">스포너 · 경로 · 목표</text>
