<text x="515" y="618" text-anchor="middle" font-size="38" font-weight="700" fill="#253C50">사망 · 통과 집계</text>
<text x="515" y="666" text-anchor="middle" font-size="30" font-weight="400" fill="#344F63">처치와 출구 통과를 서로 다른 사건으로 처리</text>
<text x="60" y="813" text-anchor="start" font-size="25" font-weight="400" fill="#668192">일반 적의 웨이브 집계와 Stage 3 보스의 생존·처치는 분리합니다.</text>
