<text x="1485" y="618" text-anchor="middle" font-size="38" font-weight="700" fill="#253C50">완료 조건과 다음 웨이브</text>
<text x="1485" y="666" text-anchor="middle" font-size="30" font-weight="400" fill="#344F63">예정 스폰 종료 + 생존 일반 적 0</text>
