<text x="60" y="813" text-anchor="start" font-size="25" font-weight="400" fill="#668192">쉬움·보통·어려움에 공통 적용합니다. 방향은 중복 없이 무작위 선택하며, 실제 맵 위치를 나타낸 탑뷰는 아닙니다.</text>
