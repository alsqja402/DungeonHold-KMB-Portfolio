<text x="1000" y="961" text-anchor="middle" font-size="30" font-weight="400" fill="#344F63">KMB 확정 결과 전달 → 팀 공통 종료 조율</text>
<text x="60" y="1083" text-anchor="start" font-size="25" font-weight="400" fill="#668192">준비 요청 번호와 실제 도전 번호를 구분하고, 맵 해제 때 이전 참조와 종료 연결을 반환합니다.</text>
